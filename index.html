<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c4a">
<title>Halaqoh Al-Qur'an</title>
<style>
:root{--bg:#f5f7f2;--surface:#fff;--surface2:#eef5f0;--ink:#143a30;--muted:#6d7b75;--primary:#0f6a55;--primary2:#0b5545;--gold:#b48732;--line:#dfe7e1;--danger:#a53b36;--dangerBg:#fff0ee;--shadow:0 12px 36px rgba(21,58,48,.08);--r:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#e8f3ec,transparent 34%),var(--bg)}
.auth-box{width:min(430px,100%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}
.logo{width:52px;height:52px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:18px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.13em;font-size:12px}.auth h1{margin:8px 0 6px;font-size:32px;letter-spacing:-.03em}.muted{color:var(--muted)}
.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:750;font-size:13px}.input,.select{width:100%;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 14px;outline:none;color:var(--ink)}.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #0f6a5514}.btn{border:0;border-radius:14px;min-height:46px;padding:0 16px;font-weight:850;transition:.18s transform,.18s opacity}.btn:active{transform:scale(.98)}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}.btn-soft{background:var(--surface2);color:var(--primary)}.btn-danger{background:var(--dangerBg);color:var(--danger)}.btn-ghost{background:transparent;color:var(--muted)}.btn-full{width:100%}.error{min-height:22px;color:var(--danger);font-weight:650}.notice{padding:12px 14px;border-radius:14px;background:#fff8e8;color:#7b5b16;border:1px solid #f0dfad;font-size:13px}
.app{display:none;min-height:100dvh}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;padding:22px;background:var(--surface);border-right:1px solid var(--line);z-index:20}.brand{display:flex;gap:11px;align-items:center;font-weight:900}.brand-icon{width:40px;height:40px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:.12em}.profile{margin:24px 0 14px;padding:14px;background:var(--surface2);border-radius:17px}.profile .name{font-weight:850}.role{display:inline-flex;margin-top:5px;padding:4px 9px;border-radius:99px;background:#dbece4;color:var(--primary);font-size:11px;font-weight:850}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:13px;font-weight:800}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--primary)}.main{margin-left:260px;padding:26px;max-width:1500px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.topbar h1{font-size:30px;letter-spacing:-.04em;margin:0}.top-actions{display:flex;gap:9px}.mobile-nav{display:none}
.hero{padding:24px;border-radius:26px;background:linear-gradient(135deg,#0f6a55,#174d41);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}.hero h2{margin:0 0 5px;font-size:24px}.hero p{margin:0;color:#dcebe5}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 20px rgba(21,58,48,.04)}.stat .label{color:var(--muted);font-weight:700}.stat .value{font-size:32px;font-weight:950;margin-top:2px}.layout{display:grid;grid-template-columns:1.4fr .9fr;gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 5px 20px rgba(21,58,48,.035);margin-bottom:16px}.card h2,.card h3{margin:0 0 5px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.card-head .muted{font-size:13px}.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:17px}.empty strong{display:block;color:var(--ink);margin-bottom:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stack{display:grid;gap:8px}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;background:var(--surface2);color:var(--primary);font-size:12px;font-weight:800}.list{display:grid;gap:9px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px}.list-main{min-width:0}.list-title{font-weight:850}.list-sub{font-size:12px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{min-height:38px;padding:0 12px;border-radius:11px;font-size:13px}.mini-select{min-height:38px;padding:0 10px;font-size:13px;max-width:230px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafcf9}tr:last-child td{border-bottom:0}.danger-text{color:var(--danger);font-weight:750}.section-note{padding:11px 13px;border-radius:14px;background:#f8faf7;color:var(--muted);font-size:13px;margin-bottom:14px}.admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.admin-grid .card{margin:0}.divider{height:1px;background:var(--line);margin:18px 0}
.toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:min(360px,calc(100vw - 36px));padding:13px 15px;border-radius:15px;background:#143a30;color:#fff;box-shadow:var(--shadow);font-weight:700}.confirm-box{max-width:480px}
@media(max-width:950px){.sidebar{display:none}.main{margin:0;padding:18px 14px 88px}.cards{grid-template-columns:1fr 1fr}.layout,.admin-grid{grid-template-columns:1fr}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:68px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:800}.mobile-nav button.active{color:var(--primary)}.mobile-nav .ico{font-size:20px;line-height:20px}.topbar h1{font-size:25px}.top-actions .btn-ghost{display:none}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.auth-box{padding:23px;border-radius:23px}.hero{padding:20px}.hero h2{font-size:21px}.cards{gap:9px}.stat{padding:14px}.stat .value{font-size:27px}.card{padding:16px}.topbar{margin-bottom:17px}.top-actions .btn{min-height:42px;padding:0 12px}.actions{width:100%}.list-item{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-box">
    <div class="logo">☪</div>
    <div class="eyebrow">HALAQOH AL-QUR'AN</div>
    <h1>Masuk ke aplikasi</h1>
    <p class="muted">Kelola santri, kelompok halaqoh, hafalan, murajaah, dan rekap dalam satu tempat.</p>
    <div class="field"><label>Username</label><input id="u" class="input" autocomplete="username" placeholder="Masukkan username"></div>
    <div class="field"><label>Password</label><input id="p" class="input" type="password" autocomplete="current-password" placeholder="Masukkan password" onkeydown="if(event.key==='Enter')login()"></div>
    <div id="err" class="error"></div>
    <button class="btn btn-primary btn-full" onclick="login()">Masuk</button>
    <div class="notice" style="margin-top:14px">Pendaftaran akun <b>tidak dibuka untuk umum</b>. Akun Ustadz hanya dibuat oleh Admin.</div>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">☪</div><div><div>Halaqoh Al-Qur'an</div><small>ONLINE MANAGEMENT</small></div></div>
    <div class="profile"><div class="name" id="nm"></div><span class="role" id="rl"></span><div id="accessNote" class="list-sub" style="margin-top:8px"></div></div>
    <div class="nav">
      <button data-p="home">⌂ &nbsp; Dashboard</button>
      <button data-p="students">♙ &nbsp; Santri</button>
      <button data-p="records">▣ &nbsp; Setoran</button>
      <button data-p="recap">▤ &nbsp; Rekap</button>
      <button data-p="admin" id="adminNav">⚙ &nbsp; Admin</button>
      <button onclick="logout()">↪ &nbsp; Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><h1 id="title">Dashboard</h1><div class="top-actions"><button class="btn btn-ghost" onclick="refreshPage()">↻ Segarkan</button><button class="btn btn-danger" onclick="logout()">Keluar</button></div></div>
    <div id="v"></div>
  </main>

  <nav class="mobile-nav">
    <button data-p="home"><div class="ico">⌂</div>Home</button>
    <button data-p="students"><div class="ico">♙</div>Santri</button>
    <button data-p="records"><div class="ico">▣</div>Setoran</button>
    <button data-p="recap"><div class="ico">▤</div>Rekap</button>
    <button data-p="admin" id="adminMobile"><div class="ico">⚙</div>Admin</button>
  </nav>
</div>
<div id="toast" class="toast hidden"></div>

<script>
let me=null,page='home';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),2600)}
function setErr(msg){$('err').textContent=msg||''}
async function login(){setErr('');try{me=(await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})})).user;$('auth').style.display='none';$('app').style.display='block';$('nm').textContent=me.name;$('rl').textContent=me.role==='admin'?'ADMINISTRATOR':'USTADZ';$('accessNote').textContent=me.role==='admin'?'Akses penuh • kelola akun, kelompok & santri':'Akses terbatas • kelola setoran kelompok';$('adminNav').style.display=me.role==='admin'?'block':'none';$('adminMobile').style.display=me.role==='admin'?'block':'none';go('home')}catch(e){setErr(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}location.reload()}
function refreshPage(){render()}
function bindNav(){document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{if(x.dataset.p==='admin'&&me?.role!=='admin')return;go(x.dataset.p)})}
function go(p){page=p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===p));$('title').textContent={home:'Dashboard',students:'Data Santri',records:'Setoran & Murajaah',recap:'Rekap',admin:'Panel Admin'}[p]||'Dashboard';render()}
async function render(){try{
 if(page==='home')return await renderHome();
 if(page==='students')return await renderStudents();
 if(page==='records')return await renderRecords();
 if(page==='recap')return await renderRecapPage();
 if(page==='admin'&&me.role==='admin')return await renderAdmin();
 go('home');
}catch(e){$('v').innerHTML=`<div class="card"><b>Gagal memuat data</b><p class="muted">${esc(e.message)}</p><button class="btn btn-primary" onclick="render()">Coba lagi</button></div>`}}
async function renderHome(){const [s,r]=await Promise.all([api('/api/students'),api('/api/records')]);const roleText=me.role==='admin'?'Kelola seluruh data halaqoh dari satu tempat.':'Kelola setoran dan pantau perkembangan santri di kelompok Anda.';$('v').innerHTML=`<section class="hero"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h2>Assalamu'alaikum, ${esc(me.name)} 👋</h2><p>${roleText}</p></div><span class="pill" style="background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.2)">${me.role==='admin'?'ADMIN':'USTADZ'}</span></div></section><div class="cards"><div class="stat"><div class="label">Santri</div><div class="value">${s.length}</div></div><div class="stat"><div class="label">Hafalan</div><div class="value">${r.filter(x=>x.type==='hafalan').length}</div></div><div class="stat"><div class="label">Murajaah</div><div class="value">${r.filter(x=>x.type==='murajaah').length}</div></div><div class="stat"><div class="label">Total setoran</div><div class="value">${r.length}</div></div></div><div class="layout"><div class="card"><div class="card-head"><div><h2>Data santri</h2><div class="muted">${me.role==='admin'?'Semua kelompok':'Kelompok Anda'}</div></div>${me.role==='admin'?'<button class="btn btn-primary mini" onclick="go(\'admin\')">+ Kelola</button>':''}</div>${s.length?`<div class="list">${s.slice(0,8).map(x=>`<div class="list-item"><div class="list-main"><div class="list-title">${esc(x.name)}</div><div class="list-sub">${esc(x.halaqoh_name||'Belum dikelompokkan')}</div></div><span class="pill">${esc(x.ustadz_name||'Belum ada ustadz')}</span></div>`).join('')}</div>`:`<div class="empty"><strong>Belum ada santri</strong>${me.role==='admin'?'Tambahkan nama santri melalui Panel Admin.':'Admin belum menambahkan santri ke kelompok Anda.'}</div>`}</div><div class="card"><div class="card-head"><div><h2>Akses akun</h2><div class="muted">Hak akses saat ini</div></div><span class="pill">${me.role==='admin'?'Admin':'Ustadz'}</span></div><div class="stack"><div class="list-item"><div><b>${me.role==='admin'?'Tambah santri & kelompok':'Input hafalan & murajaah'}</b><div class="list-sub">${me.role==='admin'?'Hanya Admin yang dapat mengatur data master.':'Data terbatas pada santri kelompok Anda.'}</div></div></div><div class="list-item"><div><b>Rekap perkembangan</b><div class="list-sub">Lihat ringkasan hafalan dan murajaah.</div></div></div></div></div></div>`}
async function renderStudents(){const s=await api('/api/students');$('v').innerHTML=`<div class="card"><div class="card-head"><div><h2>${me.role==='admin'?'Semua Santri':'Santri Kelompok Anda'}</h2><div class="muted">${s.length} santri aktif</div></div>${me.role==='admin'?'<button class="btn btn-primary" onclick="go(\'admin\')">+ Tambah / Kelompokkan</button>':''}</div>${s.length?`<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kelompok</th><th>Ustadz</th>${me.role==='admin'?'<th>Aksi</th>':''}</tr></thead><tbody>${s.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.halaqoh_name||'Belum dikelompokkan')}</td><td>${esc(x.ustadz_name||'-')}</td>${me.role==='admin'?`<td><button class="btn btn-danger mini" onclick="deleteStudent(${x.id},'${esc(x.name)}')">Hapus</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Belum ada nama santri</strong>${me.role==='admin'?'Gunakan Panel Admin untuk menambahkan santri.':'Silakan hubungi Admin untuk memasukkan santri ke kelompok Anda.'}</div>`}</div>`}
async function renderRecords(){const s=await api('/api/students');$('v').innerHTML=`<div class="card"><div class="card-head"><div><h2>Catat perkembangan</h2><div class="muted">Input hafalan atau murajaah santri.</div></div></div>${s.length?`<div class="grid2"><div class="field"><label>Santri</label><select id="s" class="select">${s.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.halaqoh_name||'-')}</option>`).join('')}</select></div><div class="field"><label>Jenis</label><select id="t" class="select"><option value="hafalan">Hafalan</option><option value="murajaah">Murajaah</option></select></div><div class="field"><label>Surah</label><input id="sur" class="input" placeholder="Contoh: Al-Baqarah"></div><div class="field"><label>Ayat</label><input id="ay" class="input" placeholder="Contoh: 1-5"></div><div class="field"><label>Tanggal</label><input id="dt" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Catatan</label><input id="no" class="input" placeholder="Opsional"></div></div><button class="btn btn-primary" onclick="saveRecord()">Simpan setoran</button>`:`<div class="empty"><strong>Belum ada santri</strong>Admin perlu menambahkan dan mengelompokkan santri terlebih dahulu.</div>`}</div>`}
async function renderRecapPage(){ $('v').innerHTML=`<div class="card"><div class="card-head"><div><h2>Rekap perkembangan</h2><div class="muted">Pilih periode untuk melihat ringkasan.</div></div></div><div class="grid2"><div class="field"><label>Periode</label><select id="per" class="select"><option value="weekly">Mingguan</option><option value="monthly" selected>Bulanan</option><option value="semester">Semester</option></select></div><div class="field"><label>Tanggal acuan</label><input id="rd" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><button class="btn btn-primary" onclick="loadRecap()">Tampilkan rekap</button></div><div id="res"></div>`;await loadRecap()}
async function loadRecap(){const d=await api('/api/recap?period='+encodeURIComponent($('per').value)+'&date='+encodeURIComponent($('rd').value));$('res').innerHTML=`<div class="card"><div class="card-head"><div><h2>Hasil rekap</h2><div class="muted">${d.start} s/d ${d.end}</div></div></div>${d.rows.length?`<div class="table-wrap"><table><thead><tr><th>Santri</th><th>Hafalan</th><th>Murajaah</th><th>Total</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.hafalan}</td><td>${x.murajaah}</td><td><b>${x.hafalan+x.murajaah}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Belum ada data</strong>Tidak ada setoran pada periode ini.</div>`}</div>`}
async function renderAdmin(){const [u,h,s]=await Promise.all([api('/api/users'),api('/api/halaqoh'),api('/api/students')]);$('v').innerHTML=`<div class="admin-grid"><div class="card"><h3>👤 Tambah Ustadz</h3><p class="muted">Tidak ada pendaftaran publik. Hanya Admin yang dapat membuat akun Ustadz.</p><div class="field"><label>Nama</label><input id="un" class="input" placeholder="Nama ustadz"></div><div class="field"><label>Username</label><input id="uu" class="input" placeholder="username"></div><div class="field"><label>Password</label><input id="up" class="input" type="password" placeholder="Minimal 6 karakter"></div><button class="btn btn-primary btn-full" onclick="addU()">Buat akun Ustadz</button></div><div class="card"><h3>🕌 Kelompok Halaqoh</h3><p class="muted">Buat kelompok dan pilih Ustadz penanggung jawab.</p><div class="field"><label>Nama kelompok</label><input id="hn" class="input" placeholder="Contoh: Halaqoh Pagi A"></div><div class="field"><label>Ustadz</label><select id="hu" class="select">${u.length?u.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):'<option value="">Belum ada Ustadz</option>'}</select></div><button class="btn btn-primary btn-full" ${u.length?'':'disabled'} onclick="addH()">Buat kelompok</button></div><div class="card"><h3>🧑‍🎓 Data Santri</h3><p class="muted">Nama santri hanya bisa ditambahkan oleh Admin.</p><div class="field"><label>Nama santri</label><input id="sn" class="input" placeholder="Nama lengkap santri"></div><div class="field"><label>Kelompok</label><select id="sh" class="select">${h.length?h.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.ustadz_name||'Tanpa ustadz')}</option>`).join(''):'<option value="">Buat kelompok dulu</option>'}</select></div><button class="btn btn-primary btn-full" ${h.length?'':'disabled'} onclick="addS()">Tambah santri</button></div></div><div class="card"><div class="card-head"><div><h2>Kelompok halaqoh</h2><div class="muted">Atur pembagian santri berdasarkan kelompok.</div></div></div>${h.length?`<div class="list">${h.map(x=>`<div class="list-item"><div class="list-main"><div class="list-title">${esc(x.name)}</div><div class="list-sub">Ustadz: ${esc(x.ustadz_name||'Belum ditentukan')}</div></div><button class="btn btn-danger mini" onclick="deleteH(${x.id},'${esc(x.name)}')">Hapus</button></div>`).join('')}</div>`:`<div class="empty"><strong>Belum ada kelompok</strong>Buat kelompok terlebih dahulu, lalu tambahkan santri.</div>`}</div><div class="card"><div class="card-head"><div><h2>Daftar santri</h2><div class="muted">Data aktif yang dapat dilihat sesuai hak akses.</div></div></div>${s.length?`<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kelompok</th><th>Ustadz</th><th>Aksi</th></tr></thead><tbody>${s.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td><select class="select mini-select" onchange="moveStudent(${x.id},this.value)"><option value="">Belum dikelompokkan</option>${h.map(g=>`<option value="${g.id}" ${Number(x.halaqoh_id)===Number(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}</select></td><td>${esc(x.ustadz_name||'-')}</td><td><button class="btn btn-danger mini" onclick="deleteStudent(${x.id},'${esc(x.name)}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Data santri masih kosong</strong>Tambahkan santri satu per satu dari form di atas.</div>`}</div><div class="card" style="border-color:#f0d2cd;background:#fffaf9"><div class="card-head"><div><h2 style="color:var(--danger)">Zona berbahaya</h2><div class="muted">Gunakan hanya jika ingin memulai database dari nol.</div></div></div><button class="btn btn-danger" onclick="resetData()">Kosongkan semua santri, kelompok & setoran</button></div>`}
async function saveRecord(){try{await api('/api/records',{method:'POST',body:JSON.stringify({student_id:+$('s').value,type:$('t').value,surah:$('sur').value,ayat:$('ay').value,note:$('no').value,record_date:$('dt').value})});toast('Setoran berhasil disimpan');go('home')}catch(e){toast(e.message)}}
async function addU(){try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('un').value,username:$('uu').value,password:$('up').value})});toast('Akun Ustadz berhasil dibuat');go('admin')}catch(e){toast(e.message)}}
async function addH(){try{if(!$('hu').value)throw Error('Buat akun Ustadz terlebih dahulu');await api('/api/halaqoh',{method:'POST',body:JSON.stringify({name:$('hn').value,ustadz_id:+$('hu').value})});toast('Kelompok berhasil dibuat');go('admin')}catch(e){toast(e.message)}}
async function moveStudent(id,halaqohId){try{await api('/api/students/'+id,{method:'PATCH',body:JSON.stringify({halaqoh_id:halaqohId})});toast('Kelompok santri diperbarui');render()}catch(e){toast(e.message)}}
async function addS(){try{if(!$('sh').value)throw Error('Buat kelompok terlebih dahulu');await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,halaqoh_id:+$('sh').value})});toast('Santri berhasil ditambahkan');go('admin')}catch(e){toast(e.message)}}
async function deleteStudent(id,name){if(!confirm(`Hapus santri "${name}"? Data setoran santri tetap tersimpan, tetapi santri tidak lagi aktif.`))return;try{await api('/api/students/'+id,{method:'DELETE'});toast('Santri dihapus dari daftar aktif');render()}catch(e){toast(e.message)}}
async function deleteH(id,name){if(!confirm(`Hapus kelompok "${name}"? Santri di dalamnya akan menjadi belum dikelompokkan.`))return;try{await api('/api/halaqoh/'+id,{method:'DELETE'});toast('Kelompok dihapus');go('admin')}catch(e){toast(e.message)}}
async function resetData(){const a=prompt('Ketik KOSONGKAN SEMUA DATA untuk melanjutkan.');if(a!=='KOSONGKAN SEMUA DATA')return;try{await api('/api/admin/reset-data',{method:'POST',body:JSON.stringify({confirm:a})});toast('Semua data santri, kelompok, dan setoran sudah dikosongkan');go('admin')}catch(e){toast(e.message)}}

bindNav();
</script>
</body>
</html>
