<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halaqoh Al-Qur'an</title>
<style>
:root{--bg:#f6f3e9;--card:#fffdf8;--line:#dfe4dc;--text:#173b33;--muted:#6d7772;--accent:#176b58;--danger:#b54b45}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-box{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 12px 40px #173b3312}
.logo{font-size:34px;font-weight:800}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700;font-size:14px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--accent);color:#fff}.btn-ghost{background:transparent;color:var(--accent);border:1px solid #b9cfc7}.btn-danger{background:#fff0ee;color:var(--danger)}
.err{margin-top:12px;padding:12px;border-radius:12px;background:#fff0ee;color:#9d3e38}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{padding:22px;border-right:1px solid var(--line);background:#fffdf8}.brand{font-weight:800;font-size:20px;margin-bottom:28px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.profile{padding:14px;background:#f2f5ef;border-radius:16px;margin-bottom:18px}.profile .name{font-weight:800}.profile .role{font-size:12px;color:var(--muted)}
.nav{display:grid;gap:7px}.nav button{padding:12px 14px;text-align:left;border:0;border-radius:12px;background:transparent;color:var(--text)}.nav button.active{background:#e6f0eb;color:var(--accent);font-weight:800}
.main{padding:24px;max-width:1200px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top-actions{display:flex;gap:8px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.card-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.stat{font-size:32px;font-weight:850}
.table-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:13px;color:var(--muted)}.table tr:last-child td{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;right:18px;bottom:18px;background:#173b33;color:#fff;padding:13px 16px;border-radius:13px;z-index:20}
.mobile-nav{display:none}
@media(max-width:800px){.app{display:block}.sidebar{display:none}.main{padding:18px 14px 90px}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10}.mobile-nav button{border:0;background:#fff;padding:12px 4px;color:var(--muted)}.mobile-nav button.active{color:var(--accent);font-weight:800}.topbar h1{font-size:25px}}
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="auth-box">
    <div class="logo">☾</div>
    <div class="eyebrow">HALAQOH AL-QUR'AN</div>
    <h1>Masuk ke aplikasi</h1>
    <p class="muted">Kelola santri, kelompok halaqoh, hafalan, murajaah, dan rekap dalam satu tempat.</p>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="username" autocomplete="username" required placeholder="Masukkan username"></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></div>
      <div id="loginErr" class="err hidden"></div>
      <button class="btn" style="width:100%" type="submit">Masuk</button>
    </form>
    <p class="muted" style="font-size:13px;margin-top:14px">Pendaftaran akun tidak dibuka untuk umum. Akun Ustadz dibuat oleh Admin.</p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Halaqoh Al-Qur'an<small>ONLINE MANAGEMENT</small></div>
    <div class="profile"><div id="profileName" class="name">-</div><div id="profileRole" class="role">-</div></div>
    <div class="nav">
      <button data-page="home">⌂ &nbsp; Dashboard</button>
      <button data-page="students">♟ &nbsp; Santri</button>
      <button data-page="records">▣ &nbsp; Setoran</button>
      <button data-page="recap">▤ &nbsp; Rekap</button>
      <button id="adminNav" data-page="admin" class="hidden">⚙ &nbsp; Admin</button>
      <button id="logoutBtn">↪ &nbsp; Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="title">Dashboard</h1>
      <div class="top-actions"><button class="btn btn-ghost" id="refreshBtn">Refresh</button></div>
    </div>
    <div id="view"></div>
  </main>

  <nav class="mobile-nav">
    <button data-page="home">⌂<br>Home</button>
    <button data-page="students">♟<br>Santri</button>
    <button data-page="records">▣<br>Setoran</button>
    <button data-page="recap">▤<br>Rekap</button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);
let me = null;
let page = 'home';

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function showToast(msg){
  $('toast').textContent = msg;
  $('toast').classList.remove('hidden');
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => $('toast').classList.add('hidden'), 2600);
}

function normalizeList(data, keys=[]){
  if(Array.isArray(data)) return data;
  for(const k of keys){
    if(data && Array.isArray(data[k])) return data[k];
  }
  if(data && Array.isArray(data.data)) return data.data;
  if(data && Array.isArray(data.rows)) return data.rows;
  return [];
}

async function api(url, opts={}){
  const res = await fetch(url, {
    credentials:'include',
    ...opts,
    headers:{
      'Content-Type':'application/json',
      ...(opts.headers || {})
    }
  });

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; }
  catch { data = text; }

  if(res.status === 401){
    me = null;
    $('app').classList.add('hidden');
    $('auth').classList.remove('hidden');
    throw new Error(data?.error || 'Sesi login sudah habis.');
  }
  if(!res.ok){
    throw new Error(data?.error || data?.message || text || `HTTP ${res.status}`);
  }
  return data;
}

async function loadMe(){
  try{
    const data = await api('/api/me');
    me = data?.user || data;
    return true;
  }catch(e){
    return false;
  }
}

function setActive(){
  document.querySelectorAll('[data-page]').forEach(b =>
    b.classList.toggle('active', b.dataset.page === page)
  );
}

async function render(){
  setActive();
  const titles={home:'Dashboard',students:'Santri',records:'Setoran',recap:'Rekap',admin:'Admin'};
  $('title').textContent=titles[page] || 'Dashboard';

  try{
    if(page==='home') return await renderHome();
    if(page==='students') return await renderStudents();
    if(page==='records') return await renderRecords();
    if(page==='recap') return await renderRecap();
    if(page==='admin' && me?.role==='admin') return await renderAdmin();
    page='home';
    return await renderHome();
  }catch(e){
    $('view').innerHTML=`<div class="card"><b>Gagal memuat data</b><p class="muted">${esc(e.message)}</p></div>`;
  }
}

async function renderHome(){
  const [studentsData, recordsData] = await Promise.all([
    api('/api/students'),
    api('/api/records')
  ]);

  const students = normalizeList(studentsData,['students','santri']);
  const records = normalizeList(recordsData,['records','setoran']);

  $('view').innerHTML=`
    <div class="cards">
      <div class="card"><div class="card-head"><b>Total Santri</b></div><div class="stat">${students.length}</div></div>
      <div class="card"><div class="card-head"><b>Total Setoran</b></div><div class="stat">${records.length}</div></div>
      <div class="card"><div class="card-head"><b>Status</b></div><div class="stat" style="font-size:24px">Online</div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Selamat datang, ${esc(me?.name || me?.username || 'Ustadz')}</h2>
      <p class="muted">Gunakan menu di bawah untuk mengelola data halaqoh.</p>
    </div>`;
}

async function renderStudents(){
  const data = normalizeList(await api('/api/students'),['students','santri']);
  $('view').innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <h2>Daftar Santri</h2><p class="muted">Data santri yang tersimpan di server.</p>
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Nama</th><th>Kelompok</th><th>Status</th></tr></thead>
      <tbody>${data.length ? data.map(s=>`
        <tr><td>${esc(s.name || s.nama || '-')}</td>
        <td>${esc(s.halaqoh_name || s.halaqoh || s.group_name || '-')}</td>
        <td>${s.active===0?'Tidak aktif':'Aktif'}</td></tr>`).join('') :
        '<tr><td colspan="3">Belum ada data santri.</td></tr>'}</tbody>
    </table></div>`;
}

async function renderRecords(){
  const data = normalizeList(await api('/api/records'),['records','setoran']);
  $('view').innerHTML=`
    <div class="card" style="margin-bottom:14px"><h2>Setoran</h2><p class="muted">Riwayat setoran santri.</p></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Santri</th><th>Tipe</th><th>Surah</th><th>Ayat</th><th>Tanggal</th></tr></thead>
      <tbody>${data.length ? data.map(r=>`
        <tr><td>${esc(r.student_name || r.name || '-')}</td>
        <td>${esc(r.type || '-')}</td><td>${esc(r.surah || '-')}</td>
        <td>${esc(r.ayat || '-')}</td><td>${esc(r.record_date || r.date || '-')}</td></tr>`).join('') :
        '<tr><td colspan="5">Belum ada setoran.</td></tr>'}</tbody>
    </table></div>`;
}

async function renderRecap(){
  const data = await api('/api/recap?period=monthly');
  const rows = normalizeList(data,['rows','recap']);
  $('view').innerHTML=`
    <div class="card" style="margin-bottom:14px"><h2>Rekap Bulanan</h2><p class="muted">Ringkasan hafalan dan murajaah.</p></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Santri</th><th>Hafalan</th><th>Murajaah</th></tr></thead>
      <tbody>${rows.length ? rows.map(r=>`
        <tr><td>${esc(r.name || r.student_name || '-')}</td>
        <td>${esc(r.hafalan ?? 0)}</td><td>${esc(r.murajaah ?? 0)}</td></tr>`).join('') :
        '<tr><td colspan="3">Belum ada data rekap.</td></tr>'}</tbody>
    </table></div>`;
}

async function renderAdmin(){
  if(me?.role!=='admin'){ page='home'; return render(); }
  $('view').innerHTML=`
    <div class="cards">
      <div class="card"><h2>Admin</h2><p class="muted">Menu administrasi aplikasi.</p>
        <div class="actions"><button class="btn" id="reloadAdmin">Muat ulang</button></div>
      </div>
    </div>`;
  $('reloadAdmin').onclick=render;
}

function go(p){
  page=p;
  render();
}

document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click',()=>go(b.dataset.page)));

$('refreshBtn').onclick=render;

$('logoutBtn').onclick=async()=>{
  try{await api('/api/logout',{method:'POST'});}catch{}
  location.reload();
};

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginErr').classList.add('hidden');
  try{
    const data = await api('/api/login',{
      method:'POST',
      body:JSON.stringify({
        username:$('username').value.trim(),
        password:$('password').value
      })
    });
    me = data?.user || data;
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('profileName').textContent=me?.name || me?.username || 'Pengguna';
    $('profileRole').textContent=me?.role || 'user';
    if(me?.role==='admin') $('adminNav').classList.remove('hidden');
    await render();
  }catch(err){
    $('loginErr').textContent=err.message;
    $('loginErr').classList.remove('hidden');
  }
};

(async()=>{
  const ok=await loadMe();
  if(ok){
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('profileName').textContent=me?.name || me?.username || 'Pengguna';
    $('profileRole').textContent=me?.role || 'user';
    if(me?.role==='admin') $('adminNav').classList.remove('hidden');
    await render();
  }
})();
</script>
</body>
</html>
