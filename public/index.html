<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halaqoh Al Qur'an</title><style>:root{--g:#12614d;--bg:#f5f2e9;--c:#fffdf8;--l:#dce2dc;--m:#68746e;--gold:#b78b31;--r:#a43b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#173b31;font-family:system-ui,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:22px}.box{width:min(430px,100%);box-shadow:0 20px 60px #0001}.brand{color:var(--gold);font-weight:900;letter-spacing:.12em}.field{width:100%;height:46px;border:1px solid var(--l);border-radius:11px;padding:0 12px;margin:5px 0 12px;background:white}.err{color:var(--r);min-height:22px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#e7eee9;color:var(--g)}.danger{background:#fff0ee;color:var(--r)}.full{width:100%}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--c);border-right:1px solid var(--l);padding:25px 18px}.profile{background:#e9f0eb;border-radius:13px;padding:12px;margin-top:18px}.nav{display:grid;gap:5px;margin-top:16px}.nav button{border:0;background:none;color:var(--m);text-align:left;border-radius:10px;padding:12px;font-weight:800}.nav button.active,.nav button:hover{background:#e5eee8;color:var(--g)}.main{margin-left:245px;padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:32px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.num{font-size:34px;font-weight:900}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--l)}th{font-size:13px;color:var(--m)}.badge{padding:4px 8px;border-radius:99px;background:#e7eee9;color:var(--g);font-size:12px;font-weight:800}.mobile{display:none}@media(max-width:800px){.side{display:none}.main{margin:0;padding:16px 14px 80px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:65px;background:var(--c);grid-template-columns:repeat(4,1fr);z-index:10}.mobile button{border:0;background:none;font-size:11px;color:var(--m)}.mobile .active{color:var(--g);font-weight:900}}</style></head><body>
<div id="login" class="auth"><div class="box"><div class="brand">HALAQOH AL QUR'AN</div><h1>Masuk ke aplikasi</h1><p class="muted">Kelola santri, hafalan, murajaah dan rekap.</p><input id="lu" class="field" placeholder="Username"><input id="lp" class="field" type="password" placeholder="Password"><div id="le" class="err"></div><button class="btn primary full" onclick="login()">Masuk</button><p class="muted" style="text-align:center">Belum punya akun? <button class="btn secondary" onclick="regView()">Daftar Ustadz</button></p></div></div>
<div id="reg" class="auth hidden"><div class="box"><div class="brand">HALAQOH AL QUR'AN</div><h1>Daftar Ustadz</h1><input id="rn" class="field" placeholder="Nama lengkap"><input id="ru" class="field" placeholder="Username"><input id="rp" class="field" type="password" placeholder="Password minimal 6 karakter"><div id="re" class="err"></div><button class="btn primary full" onclick="register()">Buat akun</button><button class="btn secondary full" style="margin-top:8px" onclick="loginView()">Kembali</button></div></div>
<div id="app" class="hidden"><aside class="side"><div class="brand">HALAQOH AL QUR'AN</div><div class="profile"><b id="who"></b><br><span id="role" class="muted"></span></div><div class="nav"><button data-p="home">⌂ Dashboard</button><button data-p="students">♟ Santri</button><button data-p="records">▣ Setoran</button><button data-p="recap">▤ Rekap</button><button id="an" data-p="admin">👑 Admin</button><button onclick="logout()">↪ Keluar</button></div></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><button class="btn danger" onclick="logout()">Keluar</button></div><div id="v"></div></main><nav class="mobile"><button data-p="home">⌂<br>Home</button><button data-p="students">♟<br>Santri</button><button data-p="records">▣<br>Setoran</button><button data-p="recap">▤<br>Rekap</button></nav></div>
<script>let me,p='home';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){let r=await fetch(u,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d}function loginView(){$('reg').classList.add('hidden');$('login').classList.remove('hidden')}function regView(){$('login').classList.add('hidden');$('reg').classList.remove('hidden')}async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});start(d.user)}catch(e){$('le').textContent=e.message}}async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('rn').value,username:$('ru').value,password:$('rp').value})});start(d.user)}catch(e){$('re').textContent=e.message}}function start(u){me=u;$('login').classList.add('hidden');$('reg').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.name;$('role').textContent=u.role==='admin'?'Administrator':'Ustadz';$('an').classList.toggle('hidden',u.role!=='admin');go('home')}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}location.reload()}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));async function go(x){p=x;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));$('title').textContent={home:'Dashboard',students:'Data Santri',records:'Setoran & Murajaah',recap:'Rekap',admin:'Dashboard Admin'}[p];try{await render()}catch(e){$('v').innerHTML='<div class="card"><b>Gagal:</b> '+esc(e.message)+'</div>'}}async function render(){if(p==='home'){let d=await api('/api/dashboard');$('v').innerHTML=`<div class=cards><div class=card><span class=muted>Santri</span><div class=num>${d.stats.students}</div></div><div class=card><span class=muted>Setoran hari ini</span><div class=num>${d.stats.today}</div></div><div class=card><span class=muted>Murajaah hari ini</span><div class=num>${d.stats.murajaah}</div></div><div class=card><span class=muted>Aktivitas 7 hari</span><div class=num>${d.stats.week}</div></div></div><div class=card><h2>Setoran terbaru</h2>${rt(d.records.slice(0,10))}</div>`}if(p==='students'){let d=await api('/api/dashboard');$('v').innerHTML=`<div class=card><div class=top><h2>Santri</h2><button class="btn primary" onclick="addS()">+ Tambah</button></div>${st(d.students)}</div>`}if(p==='records'){let d=await api('/api/dashboard');$('v').innerHTML=`<div class=card><h2>Input Hafalan / Murajaah</h2><div class=grid><div><label>Santri</label><select id=s class=field>${d.students.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select><label>Jenis</label><select id=t class=field><option>Setoran</option><option>Murajaah</option></select><label>Tanggal</label><input id=d class=field type=date value=${new Date().toISOString().slice(0,10)}></div><div><label>Surah</label><input id=su class=field placeholder="Contoh: Al-Baqarah"><label>Ayat</label><input id=a class=field placeholder="Contoh: 1-5"><label>Catatan</label><textarea id=n class=field style="height:100px;padding-top:10px"></textarea></div></div><button class="btn primary" onclick="saveR()">Simpan</button></div><div class=card><h2>Riwayat</h2>${rt(d.records)}</div>`}if(p==='recap'){let d=await api('/api/dashboard');$('v').innerHTML=`<div class=card><h2>Rekap</h2><select id=per class=field><option value=weekly>Mingguan</option><option value=monthly selected>Bulanan</option><option value=semester>Semester</option></select><input id=pd class=field type=date value=${new Date().toISOString().slice(0,10)}><button class="btn primary full" onclick="recap()">Tampilkan</button></div><div id=rr></div>`;recap()}if(p==='admin'&&me.role==='admin'){let d=await api('/api/admin/users');$('v').innerHTML=`<div class=cards><div class=card><span class=muted>Ustadz</span><div class=num>${d.totals.ustadz_count}</div></div><div class=card><span class=muted>Santri</span><div class=num>${d.totals.student_count}</div></div><div class=card><span class=muted>Setoran</span><div class=num>${d.totals.record_count}</div></div></div><div class=card><div class=top><h2>Manajemen Ustadz</h2><button class="btn primary" onclick="addU()">+ Tambah Ustadz</button></div><div class=wrap><table><tr><th>Nama</th><th>Username</th><th>Santri</th><th>Setoran</th><th>Status</th><th></th></tr>${d.users.filter(x=>x.role==='ustadz').map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${x.student_count}</td><td>${x.record_count}</td><td>${x.active?'Aktif':'Nonaktif'}</td><td><button class="btn ${x.active?'danger':'secondary'}" onclick="toggleU(${x.id},${!x.active})">${x.active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</table></div></div>`}}function st(a){return `<div class=wrap><table><tr><th>Nama</th><th>Aksi</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td><button class="btn danger" onclick="delS(${x.id},'${esc(x.name)}')">Hapus</button></td></tr>`).join('')}</table></div>`}function rt(a){return `<div class=wrap><table><tr><th>Tanggal</th><th>Santri</th><th>Jenis</th><th>Surah</th><th>Ayat</th><th>Catatan</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.student)}</td><td><span class=badge>${esc(x.type)}</span></td><td>${esc(x.surah)}</td><td>${esc(x.ayah)}</td><td>${esc(x.note||'-')}</td></tr>`).join('')}</table></div>`}async function addS(){let n=prompt('Nama santri:');if(!n)return;try{await api('/api/students',{method:'POST',body:JSON.stringify({name:n})});go('students')}catch(e){alert(e.message)}}async function delS(id,n){if(!confirm('Hapus '+n+' beserta setorannya?'))return;try{await api('/api/students/'+id,{method:'DELETE'});go('students')}catch(e){alert(e.message)}}async function saveR(){try{await api('/api/records',{method:'POST',body:JSON.stringify({studentId:+$('s').value,type:$('t').value,date:$('d').value,surah:$('su').value,ayah:$('a').value,note:$('n').value})});alert('Tersimpan');go('records')}catch(e){alert(e.message)}}function rg(period,date){let x=new Date(date+'T00:00:00'),a,b;if(period==='weekly'){let n=(x.getDay()+6)%7;a=new Date(x);a.setDate(x.getDate()-n);b=new Date(a);b.setDate(a.getDate()+6)}else if(period==='semester'){a=x.getMonth()<6?new Date(x.getFullYear(),0,1):new Date(x.getFullYear(),6,1);b=x.getMonth()<6?new Date(x.getFullYear(),5,30):new Date(x.getFullYear(),11,31)}else{a=new Date(x.getFullYear(),x.getMonth(),1);b=new Date(x.getFullYear(),x.getMonth()+1,0)}return[a.toISOString().slice(0,10),b.toISOString().slice(0,10)]}async function recap(){if(!$('per'))return;let d=await api('/api/dashboard'),[a,b]=rg($('per').value,$('pd').value),m={};d.students.forEach(s=>m[s.id]={name:s.name,setoran:0,murajaah:0});d.records.filter(r=>r.date>=a&&r.date<=b).forEach(r=>{let s=d.students.find(s=>s.name===r.student);if(s)m[s.id][r.type==='Murajaah'?'murajaah':'setoran']++});$('rr').innerHTML=`<div class=card><h2>${a} s/d ${b}</h2><div class=wrap><table><tr><th>Santri</th><th>Hafalan</th><th>Murajaah</th><th>Total</th></tr>${Object.values(m).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.setoran}</td><td>${x.murajaah}</td><td><b>${x.setoran+x.murajaah}</b></td></tr>`).join('')}</table></div></div>`}async function addU(){let name=prompt('Nama Ustadz:');if(!name)return;let username=prompt('Username:');if(!username)return;let password=prompt('Password minimal 6 karakter:');if(!password)return;try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({name,username,password})});alert('Akun dibuat');go('admin')}catch(e){alert(e.message)}}async function toggleU(id,active){try{await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({active})});go('admin')}catch(e){alert(e.message)}}(async()=>{try{let d=await api('/api/auth/me');start(d.user)}catch{}})();</script></body></html>
